services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: experience_engine
      POSTGRES_USER: experience_engine
      POSTGRES_PASSWORD: experience_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experience_engine -d experience_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - experience_engine_postgres:/var/lib/postgresql/data

volumes:
  experience_engine_postgres:
